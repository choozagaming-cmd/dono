<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personal Stream Overlay</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.overlay-root{position:absolute;opacity:0;pointer-events:none}.overlay-root.show{animation:overlayIn .5s cubic-bezier(.2,.9,.2,1) forwards}.live-el{position:absolute;display:flex;align-items:center;box-sizing:border-box;overflow:hidden;white-space:pre-wrap;line-height:1.08;text-shadow:0 2px 20px rgba(0,0,0,.36)}@keyframes overlayIn{0%{opacity:0}100%{opacity:1}}.overlay-controls{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;z-index:999999;opacity:.18}.overlay-controls:hover{opacity:1}.overlay-controls button{border:1px solid #444;background:#111;color:#fff;border-radius:8px;padding:7px 9px;font-size:11px}.obs-mode .overlay-controls{display:none}
  </style>
</head>
<body>
  <div id="overlayRoot" class="overlay-root"></div>
  <div id="overlayControls" class="overlay-controls"><button id="testSupport">Test Support</button><button id="testDrop">Test Drop</button><button id="testChallenge">Test Challenge</button><button id="skipTts">Skip TTS</button></div>
  <script>if(new URLSearchParams(location.search).get('obs')==='1')document.body.classList.add('obs-mode');</script>
  <script src="config.js?v=5.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="realtime-preview.js?v=5.1.0"></script>
  <script src="overlay-layout.js?v=5.1.0"></script>
  <script src="overlay-runtime.js?v=5.1.0"></script>
</body>
</html>
